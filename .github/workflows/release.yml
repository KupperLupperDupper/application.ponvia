name: Release APK

# Builds a signed-by-default release APK, generates a changelog and an install QR code,
# and publishes a GitHub Release with both attached.
#
# Trigger: push a version tag (e.g. `git tag v0.1.0 && git push origin v0.1.0`),
# or run manually via "Run workflow" and supply the version.
#
# NOTE: This requires the Flutter project to exist (M1+). It is inert until then.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to release (e.g. v0.1.0)'
        required: true

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.44.9'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history for changelog)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve version + tag
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.version }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "apk_name=ponvia-$VERSION.apk" >> "$GITHUB_OUTPUT"
          echo "apk_url=https://github.com/${GITHUB_REPOSITORY}/releases/download/$TAG/ponvia-$VERSION.apk" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          # Caches ~/.gradle/caches and ~/.gradle/wrapper (the downloaded Gradle
          # distribution) across runs, so a re-run doesn't have to re-fetch the
          # distribution that occasionally flakes with a SocketException.
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run code generation
        # Generated *.g.dart / *.drift.dart are gitignored (see .gitignore), so build them
        # here. Harmless no-op if the project has no build_runner-based generators yet.
        run: dart run build_runner build --delete-conflicting-outputs || true

      - name: Decode signing keystore
        # Reconstruct the upload keystore from secrets and point Gradle at it via
        # key.properties. Without these secrets the build would fall back to the debug
        # key; we fail loudly instead so a release is never accidentally debug-signed.
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is missing — cannot sign the release."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > android/app/upload-keystore.jks
          cat > android/key.properties <<EOF
          storeFile=upload-keystore.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Build release APK
        # The Gradle-distribution download occasionally flakes with a transient
        # SocketException. Retry the build a few times before giving up.
        run: |
          build() {
            flutter build apk --release \
              --build-name="${{ steps.ver.outputs.version }}" \
              --build-number="${{ github.run_number }}"
          }
          for attempt in 1 2 3; do
            if build; then ok=1; break; fi
            echo "::warning::APK build attempt $attempt failed; retrying in 15s"
            sleep 15
          done
          if [ -z "${ok:-}" ]; then
            echo "::error::APK build failed after 3 attempts"
            exit 1
          fi
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/${{ steps.ver.outputs.apk_name }}"

      - name: Generate changelog
        id: changelog
        run: |
          TAG="${{ steps.ver.outputs.tag }}"
          # Previous tag by creation date, excluding the current one.
          PREV="$(git tag --sort=-creatordate | grep -v "^${TAG}$" | head -n1 || true)"
          if [ -n "$PREV" ]; then
            RANGE="${PREV}..HEAD"
            HEADER="Changes since ${PREV}"
          else
            RANGE=""
            HEADER="Initial changes"
          fi
          {
            echo "## ${HEADER}"
            echo ""
            git log $RANGE --no-merges --pretty=format:'- %s (%h)' || echo "- (no commits found)"
            echo ""
          } > RELEASE_NOTES.md
          echo "prev=$PREV" >> "$GITHUB_OUTPUT"

      - name: Generate install QR code
        run: |
          sudo apt-get update -y && sudo apt-get install -y qrencode
          qrencode -o "dist/ponvia-qr.png" -s 10 -m 2 "${{ steps.ver.outputs.apk_url }}"

      - name: Compose release body
        run: |
          {
            cat RELEASE_NOTES.md
            echo ""
            echo "## Install on Android"
            echo ""
            echo "Scan the QR code to download the APK to your phone, then open it to install"
            echo "(you may need to allow installing from unknown sources)."
            echo ""
            echo "![Install QR](https://github.com/${GITHUB_REPOSITORY}/releases/download/${{ steps.ver.outputs.tag }}/ponvia-qr.png)"
            echo ""
            echo "Or download directly: [\`${{ steps.ver.outputs.apk_name }}\`](${{ steps.ver.outputs.apk_url }})"
          } > RELEASE_BODY.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: Ponvia ${{ steps.ver.outputs.tag }}
          body_path: RELEASE_BODY.md
          files: |
            dist/${{ steps.ver.outputs.apk_name }}
            dist/ponvia-qr.png
